# 粉丝档案同步：构建「每个 uid 一份」的数据 → 灌进 Cloudflare KV + D1
#
# 隐私红线（站长 2026-09-22 定）：粉丝名单不得以任何静态文件形式上公网。
# 所以名单不进 git、不进 dist、不进 KV 静态值；只写进 D1，
# 前端凭本人 uid 调 /api/mine 回取自己那一份（worker/index.js 里 handleApiMine）。
#
# ── 2026-09-24 改造：历史缓存从 Actions cache 改成 Cloudflare R2 ──────────
# 为什么必须改：Actions 的 `.cache/fans` 缓存只积累到 2025-02（房间 21.6 万鸡腿），
#   而线上全历史是 253 万；`build-fans` 是「整桶覆盖写」没有部分更新，
#   用一份不完整的历史跑自动任务，会把线上 6200+ 人的档案打回 2400 人。
#   所以之前只能停掉定时、靠本机跑（本机有完整历史）。
# 现在：R2 私有桶 `wyc-archive-raw` 存着本机那份完整历史（114MB / 10 个文件），
#   CI 每次先 `aws s3 sync` 拉下来 → 增量补最近 N 天 → 跑完再 `sync` 回传。
#   R2 只存原始抓取记录（含粉丝 uid），桶是私有的，永远不进 git / dist / 公开 KV。
# 首次/重置：Actions → Fans sync → Run workflow → back 填 0（全量重建）。
name: Fans sync

on:
  # 北京时间每天 01:23（UTC 17:23）。挑这个点是因为：
  #   ① 前一天的直播基本已结束，弹幕 LRC 文件已生成
  #   ② 错开 GitHub 的整点高峰（定时本身就有 5~15 分钟调度延迟）
  # 🔴 本机那个 automation（天 00:30 跑 build-fans）已于 2026-09-24 停用 ——
  #    两边同时跑会互相抢推送，且各自的 .cache 不是同一份（会互相覆盖对方的历史）。
  schedule:
    - cron: '23 17 * * *'
  workflow_dispatch:
    inputs:
      back:
        description: '只补最近 N 天；0 = 全量重建（2022-11 起）'
        default: '3'
      lanes:
        description: '并发路数'
        default: '6'
      skip_live:
        description: '跳过直播贡献榜'
        type: boolean
        default: false
      force:
        description: '跳过人数骤降保护（真的要用这份不完整名单覆盖线上才勾）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fans-sync
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      POCKET48_TOKEN: ${{ secrets.POCKET48_TOKEN }}
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      SITE: 'https://idol.wyc0518.cc'
      SCRAPE_PROXY: ''
      # R2（S3 兼容）——ubuntu runner 自带 aws CLI v2，不需要额外安装
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: 'true'   # 否则 aws CLI 会去探 169.254.169.254 白等 1 秒
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install scraper deps
        working-directory: scraper
        run: npm ci

      - name: 从 R2 拉取历史缓存
        run: |
          if [ -z "$R2_BUCKET" ] || [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::error::R2 secrets 没配（需要 R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_BUCKET）"
            exit 1
          fi
          mkdir -p .cache/fans
          # --exact-timestamps：把本地 mtime 设成 R2 对象的 LastModified，
          # 这样跑完回传时只有真正变过的文件会被上传（否则每次白传 114MB）。
          # --exclude live-gifts.jsonl：它属于 .cache 根目录，不能落进 fans/（下面单独取）。
          aws s3 sync "s3://$R2_BUCKET/" .cache/fans/ \
            --endpoint-url "$R2_ENDPOINT" --exact-timestamps --only-show-errors \
            --exclude "live-gifts.jsonl"
          # 🔴 build-fans 的**计分第二来源**：直播弹幕 LRC 里的系统送礼播报。
          # 漏掉它 → score2026 少算一半（2026-09-24 实测 122 人受影响：ccczzz 2518→652，
          # 王语晨本人被整条剔除）。它必须落在 .cache/ 根，不能塞进 .cache/fans/。
          aws s3 cp "s3://$R2_BUCKET/live-gifts.jsonl" .cache/live-gifts.jsonl \
            --endpoint-url "$R2_ENDPOINT" --only-show-errors
          # 🔴 弹幕**断点**（已扫过的 liveId）。build-live-gifts.mjs 是 appendFileSync 追加写，
          # 场次去重全靠它；不同步 → 每轮从头扫全部场次 + 同一条礼物反复追加，
          # 而 build-fans 读取时没有去重（直接 +=），2026 鸡腿和活动分会逐天翻倍。
          aws s3 cp "s3://$R2_BUCKET/live-gifts-progress.json" .cache/live-gifts-progress.json \
            --endpoint-url "$R2_ENDPOINT" --only-show-errors || echo "⚠️ R2 上没有断点文件，本轮将全量重扫（后面有去重兜底）"
          echo "--- 拉下来的文件 ---"
          ls -la .cache/fans/
          # 🔴 闸门：拿不到完整历史就必须停，否则 build-fans 会从零重建 →
          #    线上人数从 6200+ 掉到 2400 → 就算被骤降保护拦住，这一轮也是白跑。
          SIZE=$(stat -c%s .cache/fans/room.jsonl 2>/dev/null || echo 0)
          LINES=$(wc -l < .cache/fans/room.jsonl 2>/dev/null || echo 0)
          echo "room.jsonl: $SIZE 字节 / $LINES 行"
          if [ "$SIZE" -lt 5000000 ]; then
            echo "::error::room.jsonl 只有 $SIZE 字节（完整基线约 4600 万），R2 没取到历史，终止"
            exit 1
          fi
          # 🔴 第二个闸门：缺 live-gifts.jsonl 不会报错，只会静默把计分砍半 —— 必须拦住。
          DM=$(stat -c%s .cache/live-gifts.jsonl 2>/dev/null || echo 0)
          echo "live-gifts.jsonl: $DM 字节"
          if [ "$DM" -lt 50000 ]; then
            echo "::error::live-gifts.jsonl 只有 $DM 字节（完整约 30 万），缺它 2026 活动计分会少算一半，终止"
            exit 1
          fi

      - name: 刷新直播场次列表
        # 🔴 为什么要有这一步：弹幕抓取脚本 build-live-gifts.mjs 的场次来源是
        #   `site/data/live.json`，而这个文件**只由本机的 auto-update.sh 提交**
        #   （scrape.yml / watch-live.yml 都不写它）。云端的 copies 停在本机最后一次提交，
        #   没有这一步 → 新开播的场次永远进不了列表 → 新直播的弹幕永远抓不到。
        # backfill-live.mjs 按 liveId 合并去重、可用 MAX_PAGES 限量，天然幂等。
        # 每页 20 条全团直播（她占约 2%），MAX_PAGES=20 ≈ 400 条全团 ≈ 覆盖最近若干天，够用。
        env:
          MAX_PAGES: '20'
          MAX_DETAILS: '0'      # 跳过补播放地址（对计分无用，且慢）
        run: |
          node scripts/backfill-live.mjs || echo "⚠️ 直播列表刷新失败，退回仓库现有 live.json"
          node -e "const j=require('./site/data/live.json');const a=j.live||[];const n=a.slice().sort((x,y)=>+y.ctime-+x.ctime);console.log('live.json 场次:',a.length,'| 最新:',n[0]?new Date(+n[0].ctime).toISOString().slice(0,10):'-')" || true

      - name: 抓取直播弹幕（2026 活动计分第二来源）
        run: |
          # 断点里没有的场次才会被扫；--limit 是上限保护，防止某次断点丢失后一口气扫 787 场
          node scripts/build-live-gifts.mjs --limit 80 || echo "⚠️ 弹幕抓取异常，继续用已有数据"
          # 🛡️ 去重自愈：appendFileSync 遇到断点缺失/并发会写出重复行，
          # 而 build-fans 读取时 **不做去重**（第 456 行直接 +=），重复会让分数翻倍。
          # 所以每次抓完都按「场次+时刻+昵称+礼物+件数」压一遍。
          node -e "
            const fs=require('fs');
            const P='.cache/live-gifts.jsonl';
            if(!fs.existsSync(P)) { console.log('无弹幕文件，跳过去重'); process.exit(0); }
            const lines=fs.readFileSync(P,'utf8').split('\n').filter(Boolean);
            const seen=new Set(), out=[];
            for(const l of lines){
              let o; try{o=JSON.parse(l);}catch{continue;}
              const k=[o.liveId,o.time,o.nick,o.gift,o.num].join('|');
              if(seen.has(k)) continue;
              seen.add(k); out.push(l);
            }
            const dup=lines.length-out.length;
            if(dup){ fs.writeFileSync(P,out.join('\n')+'\n'); console.log('去重：'+lines.length+' → '+out.length+'（去掉重复 '+dup+' 条）'); }
            else console.log('无需去重（'+out.length+' 条）');
          "

      - name: 构建粉丝档案
        run: |
          ARGS="--lanes ${{ inputs.lanes || '6' }}"
          if [ -n "${{ inputs.back }}" ]; then ARGS="$ARGS --back ${{ inputs.back }}"; else ARGS="$ARGS --back 3"; fi
          if [ "${{ inputs.skip_live }}" = "true" ]; then ARGS="$ARGS --no-live"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force-push"; fi
          node scripts/build-fans.mjs $ARGS --push

      - name: 回传 R2（只在构建成功后）
        run: |
          # 不回传 kv/（本机发布用的 102 个断点分片，与 CI 无关）、
          # 本机备份 .bak-*、以及一次性调试产物。
          aws s3 sync .cache/fans/ "s3://$R2_BUCKET/" \
            --endpoint-url "$R2_ENDPOINT" --only-show-errors \
            --exclude "kv/*" --exclude "*.bak-*" --exclude "melee-probe.json"
          # 同一个道理：计分第二来源也要回传（否则下轮 CI 又缺它）
          aws s3 cp .cache/live-gifts.jsonl "s3://$R2_BUCKET/live-gifts.jsonl" \
            --endpoint-url "$R2_ENDPOINT" --only-show-errors
          # 🔴 弹幕断点必须回传：不传的话下轮 CI 没有「已扫过」记录 → 全량重扫 + 重复 append
          aws s3 cp .cache/live-gifts-progress.json "s3://$R2_BUCKET/live-gifts-progress.json" \
            --endpoint-url "$R2_ENDPOINT" --only-show-errors
          echo "--- R2 现有对象 ---"
          # ⚠️ `aws s3 ls` 不支持 --only-show-errors（只有 cp/sync/mv/rm 有），加上会 exit 252
          aws s3 ls "s3://$R2_BUCKET/" --endpoint-url "$R2_ENDPOINT" --human-readable

      - name: 报告
        if: always()
        run: |
          node -e "const j=require('./.cache/fans/fans.json');console.log('共 '+j.people+' 人，起始 '+j.since);" || true
          du -sh .cache/fans/ || true
