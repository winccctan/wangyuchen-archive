# 曲库增量：把 B 站新抓到的公演 cut 的 unit 分 P，自动补进曲目库 site/js/songs.js
#
# 🔴 为什么单独一个 workflow：主抓取（scrape.yml）是「只写 KV、不写仓库」（permissions: contents: read），
#    而曲目库 songs.js 是**前端静态文件**，只能靠提交 → Cloudflare 从 main 构建才会更新。
#    两者混在一起会让 scrape.yml 每 30 分钟提一次 ⇒ 一天 48 次 CF 构建，所以这里**每天只跑一次**。
#
# 触发：北京时间每天 05:23（UTC 21:23），也可手动 workflow_dispatch（勾选 all 全量重扫老 cut）。
# 只处理「扫描清单里没有的新投稿」——历史那 133 条已标记为已扫，不会一次性灌几百首没核对过的歌。
name: 曲库增量·cut unit

on:
  schedule:
    # 北京 05:23 / 17:23 —— 12 小时一次（2026-09-27 站长定）。
    # 为什么不是更密：曲目库 songs.js / bili-cuts.js 是**前端静态文件**，只能靠提交 → Cloudflare 从 main 构建才会更新，
    # 每跑一次就是一次全站构建。12 小时 = 2 次/天，够用又不至于刷屏。
    - cron: '23 21 * * *'
    - cron: '23 9 * * *'
  workflow_dispatch:
    inputs:
      all:
        description: '全量重扫（含历史老 cut，会补一大批次，产出需人工核对）'
        type: boolean
        default: false

permissions:
  contents: write                  # 需要提交 songs.js / index.html 版本号

concurrency:
  group: songs-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 微博 Cookie 存在 Cloudflare KV（SECRETS 命名空间，键 WEIBO_COOKIE），用它去取
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      WORKER_URL: ${{ secrets.WORKER_URL || 'https://idol.wyc0518.cc' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 装 pypinyin（只有新增曲目时才用到）
        run: pip install --quiet pypinyin
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 微博「公演cut」深翻页回填（WB_PAGES=20）
        # 日常那轮（scrape.yml，每 5 分钟）只翻 8 页够覆盖最近的；这里翻 20 页把更老的也捞进来，
        # 并把结果提交回仓库 ⇒ 下一次所有轮次都以它为基底，越攒越全。失败不影响后续（下轮再试）。
        run: WB_PAGES=20 node scripts/fetch-weibo-cuts.mjs || true
      - name: B站 cut 清单合并（Chzhnh 新投稿 → bili-cuts.js）
        # 以前这脚本**没有任何调用方**（注释谎称由 scrape.mjs 调用）⇒ ✂️B站cut 从不自动更新，
        # 线上一直停在我手敲出来的那份。放这里 12 小时跑一次并提交，自动跟着新投稿走。
        run: node scripts/sync-bili-cuts.mjs
      - name: 抓「甜橙小铺」新视频（曲目「只看这首」的数据源之一）
        # 增量并入 scripts/orange-shop.json；新出现的写进 scripts/orange-new.json，供下一轮人工勾选。
        # 失败不影响本轮（下轮会重试，且清单本身不会被写坏：脚本全程只做 bvid 级增量合并）。
        run: node scripts/fetch-orange-shop.mjs || true
      - name: 解析新 cut 的分 P → unit 清单
        run: python scripts/sync-cut-units.py --fetch ${{ github.event.inputs.all == 'true' && '--all' || '' }}
      - name: 合并进曲目库
        id: merge
        run: python scripts/sync-cut-units.py --ver "$(date +%s)000"
      - name: 有改动就提交（不带 site/data 等抓取产物）
        run: |
          git config user.name  "songs-sync bot"
          git config user.email "archive@local"
          git add scripts/cut-units.json scripts/cut-units-scanned.json \
                  scripts/orange-shop.json scripts/orange-new.json \
                  scripts/song-pending.json scripts/song-aliases.json \
                  site/data/performance-cuts.js \
                  site/js/songs.js dist/js/songs.js \
                  site/js/bili-cuts.js dist/js/bili-cuts.js \
                  site/index.html dist/index.html
          if git diff --cached --quiet; then
            echo "本次没有新增曲目，跳过提交"
          else
            git commit -m "auto: 曲库增量·cut unit $(TZ=Asia/Shanghai date '+%Y-%m-%d')"
            BR="${GITHUB_REF#refs/heads/}"
            git fetch origin "$BR"
            git rebase "origin/$BR"
            git push origin "HEAD:$BR"
            echo "已提交，Cloudflare 约 1~3 分钟生效"
          fi
