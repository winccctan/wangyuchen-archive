# B站 视频库 / 直播切片：抓取 → **提交回仓库** → 同步 KV
#
# 🔴 为什么必须有这个 workflow（2026-10-15 站长定的方案）
#   B 站这一路数据是**累积式**的：抓取脚本把新投稿并进本地文件（按 BV 去重、只增不减），
#   下一次抓取以这份文件为基底继续累。
#   而 scrape.yml 是 `permissions: contents: read` —— 抓到的东西**只进 KV、不进仓库**。
#   结果就是：
#     第 N 轮：checkout 旧文件(635 条) → 抓取(697 条) → 写 KV(697 条) ✅
#     第 N+1 轮：checkout 又回到旧文件(635 条) → 只翻最近几页 → 写 KV(**635 条**) ❌ 数据被自己冲回去了
#   线上因此从 09-27 起就再没动过（一直停在 635 条 / 最新一条 2026-09-27，2026-10-15 查出）。
#   ⇒ 唯一的正解就是**把抓到的文件提交回 main**，让每一轮都以最新一份为基底。
#
# 站长 2026-10-15 选定：每 4 小时跑一次（与 scrape.yml 里的 B站重活节奏一致）。
#   🔴 提交=一次 Cloudflare 全站构建，所以**没有实质变化就不提交**：
#      由 scripts/bili-commit-guard.mjs 比对（忽略 updatedAt / progress 这类每轮都变的游标字段），
#      只有真的抓到新投稿才 commit，平时安静跳过。
#   🔴 同时把 scrape.yml 里那两步 B站 抓取删掉了：一份数据只由一个 workflow 负责，
#      避免两边各抓一遍（B站 是唯一会吃 -412 风控的东西，跑得越多越容易被限流）。
name: B站 视频库 / 切片同步

on:
  schedule:
    - cron: '17 */4 * * *'      # UTC 00:17 / 04:17 / 08:17 / 12:17 / 16:17 / 20:17
  workflow_dispatch:

permissions:
  contents: write               # 需要把抓到的数据提交回 main（这一步就是本 workflow 存在的意义）

concurrency:
  group: bili-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SCRAPE_PROXY: ${{ secrets.SCRAPE_PROXY }}     # 逗号分隔的多个备用代理（数据中心 IP 吃 -412 时兜底）
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      WORKER_URL: ${{ secrets.WORKER_URL || 'https://idol.wyc0518.cc' }}
      PAGE_SLEEP: '1800'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 两个抓取脚本都只依赖 node 内置模块（https/tls/crypto/fs），不需要 npm ci。
      # 🔴 每一步都套 `timeout` 硬上限（GNU coreutils，ubuntu 自带）：B站 撞 -412 时脚本会
      #    自己等 60/120/180 秒重试，实测单步能跑到 20 分钟 —— 一旦把整轮 timeout-minutes 吃满，
      #    后面「提交」「推 KV」会被整轮杀掉，等于又白跑一轮（2026-10-15 实跑撞到）。
      #    两个抓取脚本都是**逐页落盘**的（每抓完一页就 save），被杀掉也不会丢已抓到的部分。
      - name: 抓 B站 直播切片 / 直播回放（先跑，合集通道最稳）
        run: timeout 600 env BILI_CUT_SPACE_PAGES=3 node scripts/fetch-live-cuts.mjs || true

      - name: 抓 B站 视频库（Chzhnh / 企理鹅大帝 的公演录像与切片）
        # BILI_SPACE_BAN_TRIES 从 4 降到 2：空间投稿通道在数据中心 IP 上基本必吃 -412，
        # 重试 4 次只是白等 3 分钟；新投稿靠「合集/动态」两条通道已经能覆盖。
        run: timeout 600 env BILI_PAGE_BUDGET=6 BILI_SPACE_BAN_TRIES=2 node scripts/fetch-bili-videos.mjs || true

      - name: 合并进「公演 B站cut」清单（bili-cuts.js，含 index.html 版本号）
        run: node scripts/sync-bili-cuts.mjs || true

      # 只提交「真的有新东西」才提交 —— 一次提交 = 一次 Cloudflare 全站构建。
      - name: 判断是否有实质变化（忽略 updatedAt / progress）
        id: guard
        run: |
          set +e
          node scripts/bili-commit-guard.mjs
          code=$?
          # 3 = 无实质变化（正常情况）：不算失败，后续两步会因 changed=false 自动跳过
          if [ "$code" = "3" ]; then echo "无实质变化 → 不提交"; exit 0; fi
          exit "$code"

      - name: 有变化就提交回 main
        if: steps.guard.outputs.changed == 'true'
        run: |
          git config user.name  "bili-sync bot"
          git config user.email "archive@local"
          git add site/data/live-cuts.js site/data/bili-videos.json \
                  site/js/bili-cuts.js dist/js/bili-cuts.js \
                  site/index.html dist/index.html
          # 体积护栏（2026-10-26）：万一以后清单里混进 >10 MB 的存档（messages.json / archive.js），
          # 自动从本次提交移除并打 ::warning::，**不阻断流程**（推 KV 那一步照常跑）。
          node scripts/git-size-guard.mjs --drop
          if git diff --cached --quiet; then
            echo "暂存区为空，不提交"
            exit 0
          fi
          git commit -m "auto: B站 视频库/切片 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          BR="${GITHUB_REF#refs/heads/}"
          git fetch origin "$BR"
          git rebase "origin/$BR"
          git push origin "HEAD:$BR"
          echo "已提交，Cloudflare 约 1~3 分钟生效"

      # 数据先进 KV，前端 /api/live-cuts 才看得见（有 300s 边缘缓存，最多滞后 5 分钟）。
      # 🔴 这里**只推 live-cuts 这一个键**，不跑 sync-kv.mjs：那个是全量同步器，会顺带推发言（最大件）、
      #    直播、公演、meta，而这个 workflow 只对 B站 数据负责。
      # 🔴 worker 侧 `live-cuts` 是 **replaceKey（整键覆盖）**，不是并集 ⇒ 推一份更小的快照就是把线上冲回去，
      #    脚本自带闸门：本地条数 < 线上条数 时直接报错拒推。
      - name: 把直播切片推进 KV（仅确有新数据时）
        if: steps.guard.outputs.changed == 'true'
        run: node scripts/sync-live-cuts.mjs
