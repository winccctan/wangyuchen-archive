# 王语晨补档站 · 抓取并写入 KV（零部署更新）
# 数据不再提交 git、不再触发站点部署；抓取结果由 scripts/sync-kv.mjs 直接写进 Cloudflare KV。
# 前端从 Worker 数据 API 读取 KV → 数据更新与「代码部署」彻底解耦：只有改页面代码才部署。
name: 抓取并同步到 KV

on:
  schedule:
    - cron: '*/5 * * * *'          # 每5分钟兜底；主调度是 Cloudflare Cron 每3分钟
  workflow_dispatch: {}          # 允许手动 / Cloudflare Worker 触发

permissions:
  contents: read                 # 只读取仓库（不再写入 / 推送）

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POCKET48_TOKEN: ${{ secrets.POCKET48_TOKEN }}
      SCRAPE_PROXY: ${{ secrets.SCRAPE_PROXY }}
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      WORKER_URL: ${{ secrets.WORKER_URL || 'https://idol.wyc0518.cc' }}
      MAX_PAGES: "3"
      MAX_DETAILS: "40"
      BILI_PAGE_BUDGET: "6"
      PAGE_SLEEP: "1500"
      BILI_SPACE_BAN_TRIES: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install scraper deps
        working-directory: scraper
        run: npm ci
      - name: 抓取口袋发言 / 直播 / 公演
        working-directory: scraper
        run: node scrape.mjs
      - name: 重解析历史消息（幂等）
        run: node scripts/reparse-messages.mjs || true
      - name: 累积当前场次参演名单（前瞻）
        run: node scripts/capture-roster.mjs || true
      - name: 抓取她的公演记录
        run: MAX_DETAILS=40 node scripts/scrape-hers-performances.mjs || true
      - name: 抓取 B站 公演录像备用源
        run: BILI_PAGE_BUDGET=6 PAGE_SLEEP=1500 BILI_SPACE_BAN_TRIES=0 node scripts/fetch-bili-videos.mjs || true
      - name: 同步数据到 KV（替代提交 git → 部署）
        run: node scripts/sync-kv.mjs
