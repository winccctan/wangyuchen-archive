name: Pages 部署

# 2026-11-13：gh-pages 旧版构建器一直 `Page build failed`（duration 0），
# 原因是 mirror-gh-pages.sh 每次都 force-push 一个**全新孤儿历史**，旧版构建器在那个仓库上跑不起来。
# 改成官方推荐的「Actions 构建 + 上传产物 + deploy-pages」，只上传 dist/（几十 MB，不克隆历史），
# 顺手绕开旧构建器。gh-pages 分支继续保留，作为备份镜像。

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 构建 dist/
        run: node scripts/build-dist.mjs
      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
