<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>行程后台</title>
<style>
  :root { --ink:#123a45; --ink2:#5b7c87; --line:rgba(13,69,86,.14); --brand:#0f7f9b; --bg:#eef7fa; }
  * { box-sizing:border-box; }
  body { margin:0; padding:14px 12px 60px; background:var(--bg); color:var(--ink);
    font:15px/1.6 -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; }
  h1 { font-size:19px; margin:6px 0 14px; }
  h2 { font-size:15px; margin:22px 0 8px; color:var(--brand); }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px; }
  label { display:block; font-size:13px; color:var(--ink2); margin:10px 0 4px; }
  input, textarea, select { width:100%; font:inherit; padding:11px 12px; border:1px solid var(--line);
    border-radius:10px; background:#fff; color:var(--ink); -webkit-appearance:none; }
  textarea { min-height:130px; line-height:1.5; }
  button { width:100%; font:inherit; font-weight:600; padding:13px; border:0; border-radius:12px;
    background:var(--brand); color:#fff; margin-top:10px; }
  button.ghost { background:#fff; color:var(--brand); border:1px solid var(--brand); }
  button.gray { background:#e3eef2; color:#40595f; }
  button.mini { width:auto; padding:7px 12px; font-size:13px; font-weight:500; margin:0; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  .item { border:1px solid var(--line); border-radius:12px; padding:10px; margin-bottom:10px; background:#fbfdfe; }
  .item input, .item select { padding:9px 10px; font-size:14px; margin-bottom:6px; }
  .item .top { display:flex; gap:8px; align-items:center; }
  .kind { font-size:12px; padding:3px 8px; border-radius:8px; background:rgba(62,201,221,.16); color:#0f8fa8; }
  .kind.meet { background:rgba(224,122,154,.15); color:#c9557e; }
  .log { font-size:13px; color:var(--ink2); border-top:1px dashed var(--line); padding:8px 0; }
  .log b { color:var(--ink); }
  .msg { padding:10px 12px; border-radius:10px; background:#e6f6f2; color:#0f6e56; margin:10px 0; font-size:14px; }
  .msg.bad { background:#fdecec; color:#a32d2d; }
  .hint { font-size:12.5px; color:var(--ink2); margin:6px 0 0; }
  .muted { color:var(--ink2); font-size:13px; }
  .hide { display:none; }
  .head { display:flex; justify-content:space-between; align-items:center; gap:8px; }
</style>
</head>
<body>

<div id="login" class="card">
  <h1>行程后台</h1>
  <label for="pw">密码</label>
  <input id="pw" type="password" autocomplete="current-password" placeholder="请输入后台密码">
  <button id="btnLogin">登录</button>
  <p class="hint">登录状态保留 7 天。这个页面不对外公开，别转发地址。</p>
  <div id="loginMsg"></div>
</div>

<div id="main" class="hide">
  <div class="head"><h1>行程后台</h1><button id="btnOut" class="mini gray">退出</button></div>

  <h2>1 · 粘贴新行程</h2>
  <div class="card">
    <label for="txt">把微博正文粘进来（一行一场）</label>
    <textarea id="txt" placeholder="例如：&#10;9月26日 周六&#10;14:00 《拾忆：TEAM NIII》第二十八场&#10;17:30-19:30 中秋专场答谢见面会"></textarea>
    <div class="row">
      <div><label for="year">年份（正文没写年份时用它）</label><input id="year" type="number" value="2026"></div>
      <div><label for="src">来源链接（选填）</label><input id="src" placeholder="https://weibo.com/..."></div>
    </div>
    <button id="btnParse">解析成条目</button>
    <button id="btnAi" class="ghost">解析不出来？用 AI 再试一次</button>
    <p class="hint">微博接口现在必须登录才能抓，所以是「复制正文粘进来」而不是填链接自动抓。解析完下面可以逐条改。</p>
    <div id="parseMsg"></div>
  </div>

  <div id="editWrap" class="hide">
    <h2>2 · 核对后发布</h2>
    <div class="card">
      <div id="editList"></div>
      <button id="btnAdd" class="gray">＋ 手动加一条</button>
      <label for="ticket">可用券种（选填，留空不改）</label>
      <input id="ticket" placeholder="《终极殿堂》握手券；…">
      <label for="scorePeriod">计分时段（选填）</label>
      <input id="scorePeriod" placeholder="9月26日 - 10月7日">
      <label for="scoreRules">计分规则（一行一条，选填）</label>
      <textarea id="scoreRules" style="min-height:80px" placeholder="1分 每场公演 1 分&#10;2分 每场见面会 2 分"></textarea>
      <button id="btnPublish">合并发布（只加新的，不删旧的）</button>
      <button id="btnReplace" class="ghost">整份覆盖（谨慎）</button>
      <div id="pubMsg"></div>
    </div>
  </div>

  <h2>3 · 当前存档</h2>
  <div class="card" id="curWrap"><p class="muted">读取中…</p></div>

  <h2>4 · 提交历史</h2>
  <div class="card" id="logWrap"><p class="muted">读取中…</p></div>

  <h2>5 · 改密码</h2>
  <div class="card">
    <label for="oldP">当前密码</label><input id="oldP" type="password" autocomplete="current-password">
    <label for="newP">新密码（至少 8 位）</label><input id="newP" type="password" autocomplete="new-password">
    <button id="btnPass" class="gray">改密码</button>
    <div id="passMsg"></div>
  </div>
</div>

<script>
(function () {
  var API = location.origin;
  var TOKEN = localStorage.getItem('wyc.admin.token') || '';
  var EXP = Number(localStorage.getItem('wyc.admin.exp') || 0);
  var cur = null;                    // 当前存档（KV 里的全量）
  var rows = [];                     // 待发布条目（可编辑）

  var $ = function (id) { return document.getElementById(id); };
  function show(el, ok) { el.classList[ok ? 'remove' : 'add']('hide'); }
  function msg(id, text, bad) {
    var el = $(id);
    if (!text) { el.innerHTML = ''; return; }
    el.innerHTML = '<div class="msg' + (bad ? ' bad' : '') + '">' + text + '</div>';
  }
  function call(path, body) {
    var opt = { headers: { 'content-type': 'application/json', 'x-admin-token': TOKEN } };
    if (body) { opt.method = 'POST'; opt.body = JSON.stringify(body); }
    return fetch(API + path, opt).then(function (r) {
      return r.json().then(function (j) {
        if (r.status === 401 || r.status === 403) { logout(); throw new Error('登录已过期，请重新登录'); }
        return j;
      });
    });
  }
  function logout() {
    localStorage.removeItem('wyc.admin.token');
    localStorage.removeItem('wyc.admin.exp');
    TOKEN = ''; EXP = 0;
    show($('main'), false); show($('login'), true);
  }
  function dayText(ts) {
    var d = new Date(ts + 8 * 3600 * 1000);
    var p = function (n) { return String(n).padStart(2, '0'); };
    return d.getUTCMonth() + 1 + '月' + d.getUTCDate() + '日 ' + p(d.getUTCHours()) + ':' + p(d.getUTCMinutes());
  }

  // ---- 登录 ----
  $('btnLogin').onclick = function () {
    var pass = $('pw').value.trim();
    if (!pass) { msg('loginMsg', '请输入密码', true); return; }
    $('btnLogin').disabled = true; $('btnLogin').textContent = '登录中…';
    fetch(API + '/api/admin/login', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ pass: pass })
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok || !res.j.ok) { throw new Error((res.j && res.j.error) || '登录失败'); }
        TOKEN = res.j.token; EXP = res.j.exp || 0;
        localStorage.setItem('wyc.admin.token', TOKEN);
        localStorage.setItem('wyc.admin.exp', String(EXP));
        $('pw').value = '';
        afterLogin();
      })
      .catch(function (e) { msg('loginMsg', e.message, true); })
      .then(function () { $('btnLogin').disabled = false; $('btnLogin').textContent = '登录'; });
  };
  $('btnOut').onclick = logout;

  function afterLogin() {
    show($('login'), false); show($('main'), true);
    loadCur();
  }

  // ---- 解析 ----
  function doParse(useAi) {
    var text = $('txt').value.trim();
    if (!text) { msg('parseMsg', '先粘贴行程正文', true); return; }
    msg('parseMsg', '解析中…');
    call('/api/admin/parse', { text: text, year: $('year').value, ai: !!useAi })
      .then(function (j) {
        rows = j.items || [];
        if (!rows.length) { msg('parseMsg', '没解析出条目，可以直接点「手动加一条」自己填', true); return; }
        msg('parseMsg', '解析出 ' + rows.length + ' 条（' + (j.via === 'ai' ? 'AI' : '规则') + '），请核对后再发布');
        renderEdit();
        show($('editWrap'), true);
        $('editWrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
      })
      .catch(function (e) { msg('parseMsg', e.message, true); });
  }
  $('btnParse').onclick = function () { doParse(false); };
  $('btnAi').onclick = function () { doParse(true); };
  $('btnAdd').onclick = function () {
    rows.push({ date: '', time: '', title: '', kind: '公演' });
    renderEdit();
  };

  function renderEdit() {
    var box = $('editList');
    box.innerHTML = '';
    rows.forEach(function (r, i) {
      var d = document.createElement('div');
      d.className = 'item';
      d.innerHTML = ''
        + '<div class="top"><span class="kind' + (r.kind === '见面会' ? ' meet' : '') + '">' + (r.kind === '见面会' ? '见面会' : '公演') + '</span>'
        + '<button class="mini gray" data-del="' + i + '" style="margin-left:auto">删除</button></div>'
        + '<input type="date" value="' + (r.date || '') + '" data-f="date" data-i="' + i + '">'
        + '<input placeholder="时间，如 14:00 或 17:30-19:30" value="' + (r.time || '') + '" data-f="time" data-i="' + i + '">'
        + '<input placeholder="活动名称" value="' + (r.title || '').replace(/"/g, '&quot;') + '" data-f="title" data-i="' + i + '">'
        + '<select data-f="kind" data-i="' + i + '"><option' + (r.kind === '公演' ? ' selected' : '') + '>公演</option><option' + (r.kind === '见面会' ? ' selected' : '') + '>见面会</option></select>';
      box.appendChild(d);
    });
    box.querySelectorAll('[data-f]').forEach(function (el) {
      el.onchange = function () { rows[Number(el.getAttribute('data-i'))][el.getAttribute('data-f')] = el.value; };
    });
    box.querySelectorAll('[data-del]').forEach(function (el) {
      el.onclick = function () { rows.splice(Number(el.getAttribute('data-del')), 1); renderEdit(); };
    });
  }

  // ---- 发布 ----
  function publish(replace) {
    var items = rows.filter(function (r) { return r.date && r.title; });
    if (!items.length) { msg('pubMsg', '没有可发布的条目', true); return; }
    if (replace && !confirm('整份覆盖会替换掉存档里的全部行程，确定？')) return;
    var body = { items: items, replace: !!replace };
    var src = $('src').value.trim();
    if (src) body.source = { name: '微博', url: src, pub: new Date().toISOString().slice(0, 10) };
    var tk = $('ticket').value.trim(); if (tk) body.ticket = tk;
    var per = $('scorePeriod').value.trim(), rules = $('scoreRules').value.trim();
    if (per || rules) {
      body.score = { period: per, rules: rules ? rules.split('\n').map(function (s) { return s.trim(); }).filter(Boolean) : [] };
    }
    msg('pubMsg', '发布中…');
    call('/api/admin/schedule', body).then(function (j) {
      var t = '已发布：新增 ' + (j.added || []).length + ' 条，更新 ' + (j.updated || []).length + ' 条，现在共 ' + j.total + ' 条';
      msg('pubMsg', t);
      rows = [];
      show($('editWrap'), false);
      $('txt').value = '';
      loadCur();
    }).catch(function (e) { msg('pubMsg', e.message, true); });
  }
  $('btnPublish').onclick = function () { publish(false); };
  $('btnReplace').onclick = function () { publish(true); };

  // ---- 当前存档 ----
  function loadCur() {
    call('/api/admin/schedule').then(function (j) {
      cur = j.schedule || { items: [] };
      var box = $('curWrap');
      if (!cur.items || !cur.items.length) { box.innerHTML = '<p class="muted">存档还是空的</p>'; }
      else {
        box.innerHTML = '';
        cur.items.forEach(function (it) {
          var d = document.createElement('div');
          d.className = 'item';
          d.innerHTML = '<div class="top"><span class="kind' + (it.kind === '见面会' ? ' meet' : '') + '">' + (it.kind === '见面会' ? '见面会' : '公演') + '</span>'
            + '<span class="muted">' + it.date + ' ' + (it.weekday || '') + ' ' + (it.time || '') + '</span>'
            + '<button class="mini gray" data-rm="' + encodeURIComponent(it.date + '|' + it.title) + '" style="margin-left:auto">删除</button></div>'
            + '<div>' + it.title + '</div>';
          box.appendChild(d);
        });
        box.querySelectorAll('[data-rm]').forEach(function (el) {
          el.onclick = function () {
            var v = decodeURIComponent(el.getAttribute('data-rm')).split('|');
            if (!confirm('删除「' + v[1] + '」？')) return;
            call('/api/admin/schedule', { remove: [{ date: v[0], title: v[1] }] })
              .then(function () { loadCur(); }).catch(function (e) { alert(e.message); });
          };
        });
      }
      // 提交历史
      var lw = $('logWrap');
      var log = j.log || [];
      if (!log.length) { lw.innerHTML = '<p class="muted">还没有提交记录</p>'; }
      else {
        lw.innerHTML = log.slice(0, 12).map(function (l) {
          return '<div class="log"><b>' + dayText(l.at) + '</b> · 共 ' + l.n + ' 条 · 新增 ' + (l.added || []).length
            + ' · 更新 ' + (l.updated || []).length + ((l.removed && l.removed.length) ? ' · 删除 ' + l.removed.length : '')
            + (l.src ? '<br><a href="' + l.src + '" target="_blank" rel="noopener">来源</a>' : '') + '</div>';
        }).join('');
      }
    }).catch(function (e) { $('curWrap').innerHTML = '<p class="muted">' + e.message + '</p>'; });
  }

  // ---- 改密码 ----
  $('btnPass').onclick = function () {
    var o = $('oldP').value, n = $('newP').value;
    if (n.length < 8) { msg('passMsg', '新密码至少 8 位', true); return; }
    call('/api/admin/pass', { old: o, next: n }).then(function (j) {
      if (j && j.token) {
        TOKEN = j.token;
        localStorage.setItem('wyc.admin.token', TOKEN);
        msg('passMsg', '密码已改，登录状态已刷新');
        $('oldP').value = ''; $('newP').value = '';
      }
    }).catch(function (e) { msg('passMsg', e.message, true); });
  };

  // ---- 启动 ----
  if (TOKEN && EXP > Date.now()) { afterLogin(); }
  else if (TOKEN) { logout(); }
})();
</script>
</body>
</html>
